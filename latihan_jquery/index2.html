<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Luas Sederhana</title>
  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center">
    
  <div class="bg-white shadow-lg rounded-xl p-6 w-full max-w-md">
    <h1 class="text-2xl font-bold text-center mb-4">Kalkulator Luas</h1>

    <label for="shape" class="block font-semibold mb-2">Pilih Bangun Datar</label>
    <select id="shape" class="w-full border rounded-md p-2 mb-4">
      <option value="persegi">Persegi</option>
      <option value="segitiga">Segitiga</option>
    </select>

    <div id="inputFields" class="space-y-3 mb-4">
      ini
    </div>

    <button id="hitungBtn" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700">Hitung Luas</button>

    <p id="hasil" class="text-center mt-4 text-lg font-semibold">Hasil: -</p>
  </div>

  <script>
    function renderFields(shape) {
      const container = $('#inputFields');
      container.empty();
      if (shape === 'persegi') {
        container.append(`
          <div>
            <label for="sisi" class="block font-medium">Sisi</label>
            <input type="number" id="sisi" class="w-full border rounded-md p-2" placeholder="Masukkan sisi" />
          </div>`);
      } else {
        container.append(`
          <div>
            <label for="alas" class="block font-medium">Alas</label>
            <input type="number" id="alas" class="w-full border rounded-md p-2" placeholder="Masukkan alas" />
          </div>
          <div>
            <label for="tinggi" class="block font-medium">Tinggi</label>
            <input type="number" id="tinggi" class="w-full border rounded-md p-2" placeholder="Masukkan tinggi" />
          </div>`);
      }
    }

    $(document).ready(function () {
      renderFields($('#shape').val());

      $('#shape').on('change', function () {
        renderFields(this.value);
      });

      $('#hitungBtn').on('click', function () {
        const shape = $('#shape').val();
        let luas = 0;
        if (shape === 'persegi') {
          const sisi = parseFloat($('#sisi').val());
          if (!isNaN(sisi) && sisi > 0) {
            luas = sisi * sisi;
          } else {
            alert('Masukkan sisi yang valid!');
            return;
          }
        } else {
          const alas = parseFloat($('#alas').val());
          const tinggi = parseFloat($('#tinggi').val());
          if (!isNaN(alas) && alas > 0 && !isNaN(tinggi) && tinggi > 0) {
            luas = 0.5 * alas * tinggi;
          } else {
            alert('Masukkan alas dan tinggi yang valid!');
            return;
          }
        }
        $('#hasil').text(`Hasil: ${luas} satuan²`);
      });
    });
  </script>
</body>
</html>
