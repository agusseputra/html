<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]>      <html class="no-js"> <!--<![endif]-->
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Latihan Jquery</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./src/output.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div class="bg-white">
        <header class="absolute inset-x-0 top-0 z-50">
            <nav aria-label="Global" class="flex items-center justify-between p-6 lg:px-8">
                <div class="flex lg:flex-1">
                    <a href="#" class="-m-1.5 p-1.5">
                        <span class="sr-only">Your Company</span>
                        <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600" alt=""
                            class="h-8 w-auto" />
                    </a>
                </div>
                <div class="flex lg:hidden">
                    <button type="button" command="show-modal" commandfor="mobile-menu"
                        class="-m-2.5 inline-flex items-center justify-center rounded-md p-2.5 text-gray-700">
                        <span class="sr-only">Open main menu</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon"
                            aria-hidden="true" class="size-6">
                            <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
                <div class="hidden lg:flex lg:gap-x-12">
                    <a href="#" class="text-sm/6 font-semibold text-gray-900">Product</a>
                    <a href="#" class="text-sm/6 font-semibold text-gray-900">Features</a>
                    <a href="#" class="text-sm/6 font-semibold text-gray-900">Marketplace</a>
                    <a href="#" class="text-sm/6 font-semibold text-gray-900">Company</a>
                </div>
                <div class="hidden lg:flex lg:flex-1 lg:justify-end">
                    <a href="#" class="text-sm/6 font-semibold text-gray-900">Log in <span
                            aria-hidden="true">&rarr;</span></a>
                </div>
            </nav>
        </header>
        <main class="min-h-screen bg-gray-100 flex items-center justify-center">
            <div class="bg-white shadow-lg rounded-xl p-6 w-full max-w-md">
                <h1 class="text-2xl font-bold text-center mb-4">Kalkulator Luas</h1>

                <label for="shape" class="block font-semibold mb-2">Pilih Bangun Datar</label>
                <select id="shape" class="w-full border rounded-md p-2 mb-4">
                    <option value="persegi">Persegi</option>
                    <option value="segitiga">Segitiga</option>
                </select>

                <div id="inputFields" class="space-y-3 mb-4">
                    <div class="grid grid-cols-1 gap-x-8 gap-y-6 sm:grid-cols-2" id="inputsegitiga">
                        <div>
                            <label for="first-name" class="block text-sm/6 font-semibold text-gray-900">Alas</label>
                            <div class="mt-2.5">
                                <input id="alas" type="text" name="first-name" autocomplete="given-name"
                                    class="block w-full rounded-md bg-white px-3.5 py-2 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600" />
                            </div>
                        </div>
                        <div>
                            <label for="first-name" class="block text-sm/6 font-semibold text-gray-900">Tinggi</label>
                            <div class="mt-2.5">
                                <input id="tinggi" type="text" name="first-name" autocomplete="given-name"
                                    class="block w-full rounded-md bg-white px-3.5 py-2 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600" />
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 gap-x-8 gap-y-6 sm:grid-cols-2" id="inputpersegi">
                        <div>
                            <label for="first-name" class="block text-sm/6 font-semibold text-gray-900">Sisi</label>
                            <div class="mt-2.5">
                                <input id="sisi" type="text" name="first-name" autocomplete="given-name"
                                    class="block w-full rounded-md bg-white px-3.5 py-2 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600" />
                            </div>
                        </div>
                    </div>
                </div>

                <button id="hitungBtn" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700">Hitung
                    Luas</button>

                <p id="hasil" class="text-center mt-4 text-lg font-semibold">Hasil: -</p>
            </div>

        </main>

    </div>

    <script type="text/javascript">
        $('#hitungBtn').click(function () {
            var shape = $('#shape').val();
            var luas = 0;
            if (shape === "persegi") {
                var sisi = parseFloat($('#sisi').val());
                if (!isNaN(sisi) && sisi > 0) {
                    luas = sisi * sisi;
                } else {
                    alert('Masukkan sisi yang valid!');
                    return;
                }
            } else if (shape === "segitiga") {
                var alas = parseFloat($('#alas').val());
                var tinggi = parseFloat($('#tinggi').val());
                if (!isNaN(alas) && alas > 0 && !isNaN(tinggi) && tinggi > 0) {
                    luas = 0.5 * alas * tinggi;
                } else {
                    alert('Masukkan alas dan tinggi yang valid!');
                    return;
                }
            }
            $('#hasil').text('Hasil: ' + luas);
        });
        $("#inputsegitiga").hide();
        $("#shape").change(function () {
            var shape = $(this).val();
            if (shape === "persegi") {
                $("#inputpersegi").show();
                $("#inputsegitiga").hide();
            } else if (shape === "segitiga") {
                $("#inputpersegi").hide();
                $("#inputsegitiga").show();
            }
        });
    </script>
</body>

</html>
