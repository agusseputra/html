<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Store</title>
  <style type="text/css">
    /* Reset dasar */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Body */
body {
  font-family: Arial, sans-serif;
  line-height: 1.6;
}

/* Navbar */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
  background: #333;
  color: #fff;
}

.navbar .logo {
  font-size: 1.5rem;
  font-weight: bold;
}

.nav-links {
  list-style: none;
  display: flex;
}

.nav-links li {
  margin-left: 20px;
}

.nav-links a {
  color: #fff;
  text-decoration: none;
}

/* Hero */
.hero {
  text-align: center;
  padding: 3rem 1rem;
  background: #f4f4f4;
}

.hero h1 {
  font-size: 3vw; /* Responsive typography */
  margin-bottom: 1rem;
}

.hero p {
  font-size: 1.2rem;
  margin-bottom: 1rem;
}

.hero button {
  padding: 10px 20px;
  border: none;
  background: #333;
  color: #fff;
  cursor: pointer;
}

/* Product Section */
.products {
  padding: 2rem;
  text-align: center;
}

.products h2 {
  margin-bottom: 1rem;
  font-size: 2rem;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}

.product-card {
  border: 1px solid #ddd;
  padding: 1rem;
  border-radius: 8px;
  background: #fff;
  transition: transform 0.2s;
}

.product-card:hover {
  transform: scale(1.05);
}

.product-card img {
  max-width: 100%;
  height: auto;
  margin-bottom: 1rem;
}

.product-card h3 {
  margin-bottom: 0.5rem;
}

.product-card p {
  margin-bottom: 1rem;
}

.product-card button {
  padding: 8px 16px;
  border: none;
  background: #333;
  color: #fff;
  cursor: pointer;
}

/* Footer */
.footer {
  text-align: center;
  padding: 1rem;
  background: #333;
  color: #fff;
  margin-top: 2rem;
}

/* Responsive Breakpoints */
@media (max-width: 768px) {
  .navbar {
    flex-direction: column;
  }

  .nav-links {
    flex-direction: column;
    margin-top: 10px;
  }

  .nav-links li {
    margin: 10px 0;
  }
}

@media (max-width: 480px) {
  .hero h1 {
    font-size: 6vw;
  }

  .product-grid {
    grid-template-columns: 1fr;
  }
}
/* Category Bar */
.category-bar {
  display: flex;
  justify-content: center;
  gap: 15px;
  background: #eee;
  padding: 0.8rem;
}

.category-bar a {
  text-decoration: none;
  color: #333;
  font-weight: bold;
}

/* Container Layout */
.container {
  display: flex;
  gap: 20px;
  padding: 1rem 2rem;
}

/* Sidebar */
.sidebar {
  flex: 1;
  max-width: 250px;
  border-right: 1px solid #ddd;
  padding: 1rem;
}

.sidebar h3 {
  margin-bottom: 0.5rem;
}

.sidebar ul {
  list-style: none;
  margin-bottom: 1rem;
}

.sidebar ul li {
  margin-bottom: 8px;
}

.sidebar ul li a {
  text-decoration: none;
  color: #333;
}

.recommend .rec-item {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
}

.rec-item img {
  margin-right: 10px;
}

/* Product Detail */
.product-detail {
  flex: 3;
  padding: 1rem;
}

.product-detail-content {
  display: flex;
  gap: 20px;
  margin-bottom: 2rem;
}

.product-image img {
  max-width: 100%;
  border: 1px solid #ddd;
  border-radius: 8px;
}

.product-info h2 {
  margin-bottom: 10px;
}

.product-info .price {
  font-size: 1.5rem;
  color: #e60023;
  margin-bottom: 10px;
}

.product-info .desc {
  margin-bottom: 10px;
}

.product-info .rating {
  margin-bottom: 15px;
}

.product-info button {
  padding: 10px 20px;
  border: none;
  background: #333;
  color: #fff;
  cursor: pointer;
}

/* Reviews */
.reviews {
  margin-top: 2rem;
}

.reviews h3 {
  margin-bottom: 1rem;
}

.review {
  margin-bottom: 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid #ddd;
}

/* Responsive */
@media (max-width: 992px) {
  .container {
    flex-direction: column;
  }

  .sidebar {
    max-width: 100%;
    border-right: none;
    border-bottom: 1px solid #ddd;
  }

  .product-detail-content {
    flex-direction: column;
  }
}

  </style>
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <div class="logo">MyShop</div>
    <nav>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Cart</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Big Sale! Up to 50% Off</h1>
    <p>Find the best deals on our products today.</p>
    <button>Shop Now</button>
  </section>

  <!-- Product Section -->
  <section class="products">
    <h2>Our Products</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="https://via.placeholder.com/200" alt="Product 1">
        <h3>Product 1</h3>
        <p>$20.00</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/200" alt="Product 2">
        <h3>Product 2</h3>
        <p>$25.00</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/200" alt="Product 3">
        <h3>Product 3</h3>
        <p>$15.00</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/200" alt="Product 4">
        <h3>Product 4</h3>
        <p>$30.00</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 MyShop. All Rights Reserved.</p>
  </footer>
</body>
</html>
